name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  check-3ds:
    name: Validate 3DS Client
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile 3DS App
        run: |
          cd sysmon-3ds
          make clean
          make

      - name: Verify 3DSX Binary Exists
        run: |
          test -f sysmon-3ds/sysmon-3ds.3dsx

  check-linux:
    name: Validate Linux Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libasound2-dev libudev-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: sysmon-server -> target

      - name: Cargo Check & Test
        run: |
          cd sysmon-server
          cargo check
          cargo test

  check-windows:
    name: Validate Windows Server
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: sysmon-server -> target

      - name: Cargo Check & Test
        run: |
          cd sysmon-server
          cargo check
          cargo test
